<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #888; display: flex; gap: 24px; padding: 24px; align-items: center; }

  .box { width: 64px; height: 64px; display: grid; place-items: center; }
  img.s16 { width: 16px; height: 16px; }
  img.s32 { width: 32px; height: 32px; }
  img.s64 { width: 64px; height: 64px; }
</style>
<div class="cell"><div class="box" style="background:#e8e6e1"><img class="s16" src="favicon.svg"></div></div>
<div class="cell"><div class="box" style="background:#e8e6e1"><img class="s32" src="favicon.svg"></div></div>
<div class="cell"><div class="box" style="background:#171614"><img class="s64" src="favicon.svg"></div></div>
<div class="cell"><div class="box" style="background:#F4F2EC"><img class="s64" src="favicon.svg"></div></div>
